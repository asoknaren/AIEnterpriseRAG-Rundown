[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-api-service"
version = "0.1.0"
description = "FastAPI vector storage and retrieval service for Enterprise RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "qdrant-client>=1.8.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "ollama>=0.3.0",
    "fastembed>=0.3.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
ignore_missing_imports = true